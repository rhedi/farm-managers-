<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#24301f" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#10160e" media="(prefers-color-scheme: dark)">
  <script>
    // Theme before first paint, same rule as js/ui/theme.js (which keeps it in sync afterwards).
    (function () {
      var pref = 'auto';
      try { pref = localStorage.getItem('farm-manager-theme') || 'auto'; } catch (e) { /* storage blocked */ }
      var dark = pref === 'dark' || (pref !== 'light' && !!window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
    })();
  </script>
  <script>
    // Stuck-update escape hatch, which also rescues older installed versions: index.html always comes from
    // the network, and VERSION is this deploy's build (same value as in sw.js, written by the README command).
    // A page controlled by a service worker whose cache still lacks this build after an update check drops
    // every service worker and farm-manager-* cache (never localStorage: the save stays) and reloads from the
    // network, at most once per session. Until then the modules may run old files; they load and autosave
    // the save as usual, and the new files migrate it.
    (function () {
      var VERSION = "b270c86ffe";
      document.documentElement.setAttribute('data-version', VERSION);
      var sw = navigator.serviceWorker, GUARD = 'farm-manager-sw-reset';
      if (!sw || !sw.controller || !window.caches) return;
      function hasBuild() {
        return caches.match('index.html', { cacheName: 'farm-manager-' + VERSION }).then(function (res) { return !!res; });
      }
      function installed(worker) { // a slow install is waited out: Chrome itself ends a stuck install event
        return new Promise(function (resolve) {
          if (!worker || worker.state !== 'installing') return resolve();
          worker.addEventListener('statechange', function () { if (worker.state !== 'installing') resolve(); });
        });
      }
      function reset() {
        if (sessionStorage.getItem(GUARD) === VERSION) return; // already tried this session: no reload loop
        sessionStorage.setItem(GUARD, VERSION);
        return sw.getRegistrations().then(function (regs) {
          return Promise.all(regs.map(function (reg) { return reg.unregister(); }));
        }).then(function () { return caches.keys(); }).then(function (keys) {
          return Promise.all(keys.filter(function (key) { return key.indexOf('farm-manager-') === 0; })
            .map(function (key) { return caches.delete(key); }));
        }).then(function () { location.reload(); });
      }
      hasBuild().then(function (ok) {
        return ok || sw.getRegistration().then(function (reg) {
          // update() rejects offline: then the installed version keeps running.
          return reg && reg.update().then(function () { return installed(reg.installing); })
            .then(hasBuild).then(function (ok) { return ok || reset(); });
        });
      }).catch(function () { /* offline or storage blocked: keep the installed version */ });
    })();
  </script>
  <meta name="description" content="Farm Manager — kelola ladang, mesin, dan ternakmu.">
  <title>Farm Manager</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-title" content="Farm Manager">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/fields.css">
  <link rel="stylesheet" href="css/economy.css">
  <link rel="stylesheet" href="css/world.css">
  <link rel="stylesheet" href="css/ops.css">
  <link rel="stylesheet" href="css/juice.css">
  <link rel="stylesheet" href="css/factories.css">
  <link rel="stylesheet" href="css/missions.css">
  <link rel="stylesheet" href="css/levels.css">
  <link rel="stylesheet" href="css/breeding.css">
  <link rel="stylesheet" href="css/finance.css">
  <link rel="stylesheet" href="css/logistics.css">
  <link rel="stylesheet" href="css/orchard.css">
  <link rel="stylesheet" href="css/fish.css">
  <link rel="stylesheet" href="css/v16.css">
  <link rel="stylesheet" href="css/mandor.css">
  <link rel="stylesheet" href="css/v17.css">

</head>
<body>
  <header id="topbar">
    <div class="topbar-row">
      <div class="stat stat-money" title="Uang — ketuk untuk laporan keuangan">💰 <span id="money">0</span></div>
      <div class="stat stat-level" title="Level">
        <div class="lv-row"><span class="lv">⭐ <span class="lv-word">Lv </span><span id="level">1</span></span><span class="xp-text" id="xptext"></span></div>
        <div class="progress progress-xp"><div class="bar" id="xpbar" style="width:0%"></div></div>
      </div>
      <div class="stat stat-weather" id="weather" title="Cuaca"><span id="weather-now">☀️</span><span class="season-chip" id="season-chip"></span></div>
    </div>
    <div class="topbar-row">
      <div class="stat stat-clock" id="clock">H1 · 06:00</div>
      <div class="speed-group" role="group" aria-label="Kecepatan waktu">
        <button class="speed-btn" id="speed-0" data-speed="0" title="Jeda">⏸</button>
        <button class="speed-btn active" id="speed-1" data-speed="1" title="Normal">1×</button>
        <button class="speed-btn" id="speed-2" data-speed="2" title="Cepat">2×</button>
        <button class="speed-btn" id="speed-5" data-speed="5" title="Sangat cepat">5×</button>
      </div>
      <button class="top-btn" id="settings-btn" type="button" title="Pengaturan" aria-label="Pengaturan">⚙️</button>
    </div>
  </header>

  <div id="coach" hidden></div>
  <main id="view"></main>

  <nav id="tabs">
    <button class="tab active" data-tab="farm"><span class="tab-icon">🗺️</span><span class="tab-label">Ladang</span></button>
    <button class="tab" data-tab="garage"><span class="tab-icon">🚜</span><span class="tab-label">Garasi</span></button>
    <button class="tab" data-tab="market"><span class="tab-icon">📈</span><span class="tab-label">Pasar</span></button>
    <button class="tab" data-tab="animals"><span class="tab-icon">🐄</span><span class="tab-label">Ternak</span></button>
    <button class="tab" data-tab="silo"><span class="tab-icon">🏚️</span><span class="tab-label">Gudang</span></button>
    <button class="tab" data-tab="achievements"><span class="tab-icon">🏆</span><span class="tab-label">Prestasi</span></button>
  </nav>

  <div id="modal-root"></div>
  <div id="toast-root"></div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
